# Runner API는 loopback만 허용한다. SSH local-forward로만 접속한다.
bind = "127.0.0.1:47831"
# 작업 대상 경계. root 자신이 git repository거나, root 아래의 git repository가 깊이 제한
# 없이 Desktop 레포 목록에 자동으로 뜬다(너비 우선, 방문 1만 디렉터리·100건 상한).
# 경계 밖 경로는 모든 API에서 거부된다.
repository_roots = ["/home/praxis/projects"]
max_concurrent_tasks = 2
# always_approve = 생성 즉시 queue, require_approval = Desktop에서 승인 후 queue
execution_policy = "always_approve"
# `openssl rand -hex 32 > ~/.config/praxis/pairing.token && chmod 600 ~/.config/praxis/pairing.token`
pairing_token_file = "/home/praxis/.config/praxis/pairing.token"
